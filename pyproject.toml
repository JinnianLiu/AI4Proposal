[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai4proposal"
version = "0.2.0"
description = "Multi-Agent Grant Proposal Generation System"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "openai>=1.0.0",
    "pypandoc-binary>=1.17",
    "python-docx>=1.2.0",
]
