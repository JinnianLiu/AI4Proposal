[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai4proposal"
version = "0.2.0"
description = "Multi-Agent Grant Proposal Generation System"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.128.8",
    "jinja2>=3.1.6",
    "markdown>=3.9",
    "openai>=1.0.0",
    "pypandoc-binary>=1.17",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.20",
    "uvicorn>=0.39.0",
]
